<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SermonFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #1d4ed8;
      color: white;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .tagline {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 3px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .welcome h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .welcome p {
      color: #6b7280;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1d4ed8;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .section-title {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .sermons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .sermon-card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .sermon-card h3 {
      margin-bottom: 10px;
      font-size: 19px;
    }

    .sermon-info {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      color: #6b7280;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .header-inner {
        align-items: flex-start;
      }

      .welcome h1 {
        font-size: 25px;
      }
    }
  </style>

</head>

<body>

  <header>
    <div class="header-inner">
      <div>
        <div class="logo">SermonFlow</div>
        <div class="tagline">Your sermons. Organized. Accessible. Secure.</div>
      </div>
    </div>
  </header>

  <main class="container">

<section class="welcome">
  <h1>Welcome to SermonFlow</h1>
  <p>
    Store, organize, and manage your sermons in one place.
  </p>

  <div class="actions">
    <input type="file" id="sermonAudio" accept="audio/*">

    <button class="primary" onclick="addSermon()">
      + Add Sermon
    </button>

<button id="signInButton" class="secondary" onclick="signIn()">

      Sign In
    </button>
  </div>
</section>

<input
  type="text"
  id="search"
  class="search"
  placeholder="Search sermons..."
  oninput="searchSermons()"
>

<h2 class="section-title">Sermon Archive</h2>

<div id="sermons" class="sermons">

  <div class="empty" id="emptyMessage">
    <h3>No sermons yet</h3>
    <p>
      Your sermon archive will appear here once you add your first sermon.
    </p>
  </div>

</div>
  </main>

  <footer>
    SermonFlow © 2026
  </footer>

  <script>

    let sermons = [];

    function addSermon() {

      const title = prompt("Enter the sermon title:");

      if (!title) {
        return;
      }

      const preacher = prompt("Enter the preacher's name:");

      if (!preacher) {
        return;
      }

      const date = new Date().toLocaleDateString();

      sermons.push({
        title: title,
        preacher: preacher,
        date: date
      });

      displaySermons();
    }

    function displaySermons(list = sermons) {

      const container = document.getElementById("sermons");

      if (list.length === 0) {

        container.innerHTML = `
          <div class="empty">
            <h3>No sermons found</h3>
            <p>Try another search or add a new sermon.</p>
          </div>
        `;

        return;
      }

      container.innerHTML = "";

      list.forEach(sermon => {

        const card = document.createElement("div");

        card.className = "sermon-card";

        card.innerHTML = `
          <h3>${escapeHtml(sermon.title)}</h3>

          <div class="sermon-info">
            <strong>Preacher:</strong> ${escapeHtml(sermon.preacher)}
            <br>
            <strong>Date:</strong> ${escapeHtml(sermon.date)}
          </div>
        `;

        container.appendChild(card);

      });
    }

    function searchSermons() {

      const query = document
        .getElementById("search")
        .value
        .toLowerCase();

      const results = sermons.filter(sermon =>

        sermon.title.toLowerCase().includes(query) ||
        sermon.preacher.toLowerCase().includes(query)

      );

      displaySermons(results);
    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

  </script>

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  const app = initializeApp(firebaseConfig); 
const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {

if (user) {

} else {

  window.signIn = async function() { 
const email = prompt("Enter your email:"); 
if (!email) return;

const password = prompt("Enter your password:");

try {

alert("Signed in successfully!"); 
} catch (error) {

</script>

</body>
</html>
